[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vaultwarden-mcp-server"
version = "0.2.0"
description = "MCP server that serves AI agents secrets from an age-encrypted passage store"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0"]

[project.scripts]
vaultwarden-mcp-server = "vaultwarden_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultwarden_mcp"]
