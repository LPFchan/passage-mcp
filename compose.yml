services:
  vaultwarden-mcp:
    build: .
    container_name: vaultwarden-mcp
    user: "1001:1001"
    mem_limit: 128m
    memswap_limit: 128m
    oom_score_adj: 500
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      # ciphertext only; safe to back up
      - /var/lib/vaultwarden-mcp/store:/store
      # server's age identity; root:1001 0640 on the host, never inside the store
      - /etc/vaultwarden-mcp/age-identity:/run/secrets/age-identity:ro
      - ./config/config.json:/config/config.json:ro
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SECRETS_STORE_DIR: /store
      AGE_IDENTITY_FILE: /run/secrets/age-identity
